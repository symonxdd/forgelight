# Releases a version when its tag (such as v0.2.0) is pushed:
#   1. checks and builds the interface (page/), which main never contains;
#   2. puts the ready-to-run copy on the "release" branch, which Forge's Install from URL
#      and git clone use. It holds only what runs: the Python code, the built page/, the
#      assets, README, CHANGELOG and license; no interface source code or docs;
#   3. creates the GitHub release "Forgelight 0.2.0" with its CHANGELOG section and the
#      same copy as forgelight-0.2.0.zip.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# One release at a time, in order, so the release branch never skips back.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tag matches the version in web/package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./web/package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $declared in web/package.json."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Update the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_commit=$(git rev-parse HEAD)
          # Only what runs, assembled in a separate index. page/ is ignored on main, hence --force.
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git read-tree --empty
          for path in scripts forgelight_backend page assets README.md CHANGELOG.md LICENSE .gitignore; do
            if [ -e "$path" ]; then git add --force "$path"; fi
          done
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          parent=""
          if git fetch --depth=1 origin release 2>/dev/null; then
            parent="-p FETCH_HEAD"
          fi
          commit=$(git commit-tree "$tree" $parent -m "Forgelight $VERSION" -m "Built from $source_commit ($GITHUB_REF_NAME) on main.")
          git push origin "$commit:refs/heads/release"
          # The ZIP holds the same files, in a forgelight folder ready to unzip into extensions.
          git archive --format=zip --prefix=forgelight/ -o "forgelight-$VERSION.zip" "$commit"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The page shows only this version's section of CHANGELOG.md, from its heading to the next.
          awk -v v="$VERSION" '
            /^## / { inside = (index($0, v) > 0); next }
            inside { print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" "forgelight-$VERSION.zip" \
            --title "Forgelight $VERSION" --notes-file notes.md --verify-tag

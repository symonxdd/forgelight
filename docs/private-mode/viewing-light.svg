<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 140" role="img" aria-label="The vault file is read from disk, its key K is unlocked with the private key, the image is decrypted and shown in the browser from memory." xmlns="http://www.w3.org/2000/svg" width="760" height="140"><defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(154, 157, 164)"></path></marker><marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(63, 95, 138)"></path></marker></defs><rect x="8" y="8" width="176" height="124" rx="14" stroke-dasharray="5 5" fill="rgb(245, 245, 246)" stroke="rgb(207, 209, 213)"></rect><text x="24" y="32" fill="rgb(105, 109, 116)" font-size="12px" font-weight="500" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">On disk</text><rect x="200" y="8" width="552" height="124" rx="14" stroke-dasharray="5 5" fill="rgb(245, 245, 246)" stroke="rgb(207, 209, 213)"></rect><text x="216" y="32" fill="rgb(105, 109, 116)" font-size="12px" font-weight="500" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">In memory</text><rect x="24" y="48" width="144" height="62" rx="10" fill="rgb(238, 238, 240)" stroke="rgb(207, 209, 213)"></rect><text x="38" y="73" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Vault file</text><text x="38" y="94" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">random name</text><rect x="216" y="48" width="160" height="62" rx="10" fill="rgb(63, 95, 138)" fill-opacity="0.1" stroke="rgb(63, 95, 138)"></rect><text x="230" y="73" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Unlock K</text><text x="230" y="94" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">with the private key</text><rect x="404" y="48" width="148" height="62" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(207, 209, 213)"></rect><text x="418" y="73" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Decrypt</text><text x="418" y="94" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">refuses changed files</text><rect x="580" y="48" width="156" height="62" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(207, 209, 213)"></rect><text x="594" y="73" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Browser</text><text x="594" y="94" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">shown, never cached</text><path d="M168 79 H212" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(154, 157, 164)"></path><path d="M376 79 H400" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(154, 157, 164)"></path><path d="M552 79 H576" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(154, 157, 164)"></path></svg>

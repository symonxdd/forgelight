<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 236" role="img" aria-label="Forge makes the image in memory, Forgelight encrypts it with a random key K, locks K with the public key, and only the encrypted files reach the disk." xmlns="http://www.w3.org/2000/svg" width="760" height="236"><defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(154, 157, 164)"></path></marker><marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(63, 95, 138)"></path></marker></defs><rect x="8" y="8" width="524" height="220" rx="14" stroke-dasharray="5 5" fill="rgb(245, 245, 246)" stroke="rgb(207, 209, 213)"></rect><text x="24" y="32" fill="rgb(105, 109, 116)" font-size="12px" font-weight="500" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">In memory</text><rect x="548" y="8" width="204" height="220" rx="14" stroke-dasharray="5 5" fill="rgb(245, 245, 246)" stroke="rgb(207, 209, 213)"></rect><text x="564" y="32" fill="rgb(105, 109, 116)" font-size="12px" font-weight="500" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">On disk</text><rect x="24" y="52" width="148" height="62" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(207, 209, 213)"></rect><text x="38" y="77" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Forge</text><text x="38" y="98" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">told not to save</text><rect x="200" y="52" width="148" height="62" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(207, 209, 213)"></rect><text x="214" y="77" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">New image</text><text x="214" y="98" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">never written as a file</text><rect x="376" y="52" width="140" height="62" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(207, 209, 213)"></rect><text x="390" y="77" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Encrypt</text><text x="390" y="98" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">AES-256-GCM with K</text><rect x="200" y="150" width="148" height="62" rx="10" fill="rgb(63, 95, 138)" fill-opacity="0.1" stroke="rgb(63, 95, 138)"></rect><text x="214" y="175" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Random key K</text><text x="214" y="196" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">new for every image</text><rect x="376" y="150" width="140" height="62" rx="10" fill="rgb(63, 95, 138)" fill-opacity="0.1" stroke="rgb(63, 95, 138)"></rect><text x="390" y="175" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Lock K</text><text x="390" y="196" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">with the public key</text><rect x="564" y="52" width="172" height="160" rx="10" fill="rgb(238, 238, 240)" stroke="rgb(207, 209, 213)"></rect><text x="578" y="77" fill="rgb(15, 16, 18)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Vault files</text><text x="578" y="98" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">encrypted image</text><text x="578" y="116" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">encrypted settings</text><text x="578" y="134" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">and thumbnail</text><text x="578" y="152" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">locked K</text><text x="578" y="170" fill="rgb(105, 109, 116)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">random names</text><path d="M172 83 H196" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(154, 157, 164)"></path><path d="M348 83 H372" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(154, 157, 164)"></path><path d="M516 83 H560" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(154, 157, 164)"></path><path d="M300 150 V132 H430 V118" fill="none" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-key)" stroke="rgb(63, 95, 138)"></path><path d="M348 181 H372" fill="none" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-key)" stroke="rgb(63, 95, 138)"></path><path d="M516 181 H560" fill="none" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-key)" stroke="rgb(63, 95, 138)"></path></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 300" role="img" aria-label="A password through scrypt, a PIN through the TPM chip, or a recovery key through HKDF each opens its own key slot, and any slot gives back the private key, which stays in memory." xmlns="http://www.w3.org/2000/svg" width="760" height="300"><defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(99, 103, 110)"></path></marker><marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(142, 166, 196)"></path></marker></defs><rect x="404" y="8" width="168" height="284" rx="14" stroke-dasharray="5 5" fill="rgb(20, 20, 22)" stroke="rgb(58, 59, 65)"></rect><text x="420" y="32" fill="rgb(143, 147, 154)" font-size="12px" font-weight="500" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">On disk</text><rect x="588" y="8" width="164" height="284" rx="14" stroke-dasharray="5 5" fill="rgb(20, 20, 22)" stroke="rgb(58, 59, 65)"></rect><text x="604" y="32" fill="rgb(143, 147, 154)" font-size="12px" font-weight="500" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">In memory</text><g><rect x="16" y="48" width="150" height="58" rx="10" fill="rgb(27, 27, 30)" stroke="rgb(58, 59, 65)"></rect><text x="30" y="73" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Password</text><text x="30" y="94" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">required, set up first</text><rect x="200" y="48" width="176" height="58" rx="10" fill="rgb(27, 27, 30)" stroke="rgb(58, 59, 65)"></rect><text x="214" y="73" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">scrypt</text><text x="214" y="94" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">slow on purpose</text><rect x="420" y="48" width="136" height="58" rx="10" fill="rgb(38, 38, 42)" stroke="rgb(58, 59, 65)"></rect><text x="434" y="73" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Slot 1</text><text x="434" y="94" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">private key, locked</text><path d="M166 77 H196" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(99, 103, 110)"></path><path d="M376 77 H416" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(99, 103, 110)"></path></g><g><rect x="16" y="128" width="150" height="58" rx="10" fill="rgb(27, 27, 30)" stroke="rgb(58, 59, 65)"></rect><text x="30" y="153" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">PIN</text><text x="30" y="174" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">optional, this computer</text><rect x="200" y="128" width="176" height="58" rx="10" fill="rgb(27, 27, 30)" stroke="rgb(58, 59, 65)"></rect><text x="214" y="153" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">TPM 2.0 chip</text><text x="214" y="174" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">pauses after wrong PINs</text><rect x="420" y="128" width="136" height="58" rx="10" fill="rgb(38, 38, 42)" stroke="rgb(58, 59, 65)"></rect><text x="434" y="153" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Slot 2</text><text x="434" y="174" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">private key, locked</text><path d="M166 157 H196" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(99, 103, 110)"></path><path d="M376 157 H416" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(99, 103, 110)"></path></g><g><rect x="16" y="208" width="150" height="58" rx="10" fill="rgb(27, 27, 30)" stroke="rgb(58, 59, 65)"></rect><text x="30" y="233" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Recovery key</text><text x="30" y="254" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">shown once at setup</text><rect x="200" y="208" width="176" height="58" rx="10" fill="rgb(27, 27, 30)" stroke="rgb(58, 59, 65)"></rect><text x="214" y="233" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">HKDF</text><text x="214" y="254" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">for a long random code</text><rect x="420" y="208" width="136" height="58" rx="10" fill="rgb(38, 38, 42)" stroke="rgb(58, 59, 65)"></rect><text x="434" y="233" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Slot 3</text><text x="434" y="254" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">private key, locked</text><path d="M166 237 H196" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(99, 103, 110)"></path><path d="M376 237 H416" fill="none" stroke-width="1.5" marker-end="url(#arrow-plain)" stroke="rgb(99, 103, 110)"></path></g><rect x="604" y="106" width="134" height="102" rx="10" fill="rgb(142, 166, 196)" fill-opacity="0.1" stroke="rgb(142, 166, 196)"></rect><text x="618" y="131" fill="rgb(242, 242, 243)" font-size="13.5px" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">Private key</text><text x="618" y="152" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">until Lock, or</text><text x="618" y="170" fill="rgb(143, 147, 154)" font-size="11.5px" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">until Forge stops</text><path d="M556 77 H580 V136 H600" fill="none" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-key)" stroke="rgb(142, 166, 196)"></path><path d="M556 157 H600" fill="none" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-key)" stroke="rgb(142, 166, 196)"></path><path d="M556 237 H580 V178 H600" fill="none" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-key)" stroke="rgb(142, 166, 196)"></path></svg>
